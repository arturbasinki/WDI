# WDI — serwer WWW z rozwiązaniami 8 zadań (Go)
#
#   docker compose up --build -d     # buduje obraz i startuje
#   → http://localhost:8080
#
# Port: lewa strona mapowania "HOST:KONTENER" — tylko 127.0.0.1 (aplikacja
# lokalna; pełne "8080:8080" wystawiałoby serwer w LAN). Jeśli 8080 zajmuje
# inna usługa, zmień na np. "127.0.0.1:9000:8080" i zaktualizuj PORT +
# healthcheck poniżej.

services:
  wdi:
    build:
      context: .
      dockerfile: Dockerfile
    image: wdi:latest
    container_name: wdi
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      # busybox wget z alpine; $$PORT rozwija się w kontenerze (env serwera)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/api/tasks > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
