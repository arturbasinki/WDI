# WDI — serwer WWW z rozwiązaniami 8 zadań (Go)
#
#   docker compose up --build -d     # buduje obraz i startuje
#   → http://127.0.0.1:8099          # UWAGA: 127.0.0.1, nie "localhost"
#
# Mapa "HOST:KONTENER" niżej: serwer w kontenerze słucha na PORT (8080), a na
# hoście wystawiamy go pod 8099, bo 8080 zajmuje inna usługa. Bind jest TYLKO
# na 127.0.0.1 (IPv4, aplikacja lokalna; "8099:8080" bez interfejsu wystawiłby
# serwer w LAN) — przeglądarki bywają przy "localhost" pytają o ::1 (IPv6) i
# dostają odmowę połączenia. Gdyby "localhost" miał działać, dopisz mapę
# "[::1]:8099:8080". Zmiana portu hosta = lewa strona mapy; PORT w kontenerze
# (i healthcheck przez $$PORT) wtedy zostaje bez zmian.

services:
  wdi:
    build:
      context: .
      dockerfile: Dockerfile
    image: wdi:latest
    container_name: wdi
    ports:
      - "127.0.0.1:8099:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      # busybox wget z alpine; $$PORT rozwija się w kontenerze (env serwera)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/api/tasks > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
